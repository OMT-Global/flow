name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-checks:
    name: Hosted Fast Checks
    if: ${{ !(github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/pheidon/flow-trusted-isolation'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - run: bash scripts/ci/run-fast-checks.sh

  pr-lint:
    name: Hosted Workflow Lint
    if: ${{ !(github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/pheidon/flow-trusted-isolation'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.23.12'
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  pr-extended:
    name: Hosted Extended Checks
    if: ${{ !(github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/pheidon/flow-trusted-isolation'))) && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - run: bash scripts/ci/run-extended-validation.sh

  trusted:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/pheidon/flow-trusted-isolation')) }}
    uses: OMT-Global/flow/.github/workflows/trusted-flow.yml@1a7355259ec004007a8006b9879e4783d73cb9ad
    permissions:
      contents: read

  ci-gate:
    name: CI Gate
    needs: [pr-checks, trusted]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require executed checks
        env:
          TRUSTED_EVENT: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/pheidon/flow-trusted-isolation')) }}
          TRUSTED_RESULT: ${{ needs.trusted.result }}
          HOSTED_RESULT: ${{ needs.pr-checks.result }}
        run: |
          if [[ "$TRUSTED_EVENT" == "true" ]]; then
            [[ "$TRUSTED_RESULT" == "success" && "$HOSTED_RESULT" == "skipped" ]]
          else
            [[ "$HOSTED_RESULT" == "success" && "$TRUSTED_RESULT" == "skipped" ]]
          fi

  workflow-lint:
    name: Workflow Lint
    needs: [pr-lint, trusted]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require executed checks
        env:
          TRUSTED_EVENT: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/pheidon/flow-trusted-isolation')) }}
          TRUSTED_RESULT: ${{ needs.trusted.result }}
          HOSTED_RESULT: ${{ needs.pr-lint.result }}
        run: |
          if [[ "$TRUSTED_EVENT" == "true" ]]; then
            [[ "$TRUSTED_RESULT" == "success" && "$HOSTED_RESULT" == "skipped" ]]
          else
            [[ "$HOSTED_RESULT" == "success" && "$TRUSTED_RESULT" == "skipped" ]]
          fi

  extended-validation:
    name: Extended Validation
    needs: [pr-extended, trusted]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require executed checks
        env:
          TRUSTED_EVENT: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/pheidon/flow-trusted-isolation')) }}
          TRUSTED_RESULT: ${{ needs.trusted.result }}
          HOSTED_RESULT: ${{ needs.pr-extended.result }}
        run: |
          if [[ "$TRUSTED_EVENT" == "true" ]]; then
            [[ "$TRUSTED_RESULT" == "success" && "$HOSTED_RESULT" == "skipped" ]]
          else
            [[ "$HOSTED_RESULT" == "success" && "$TRUSTED_RESULT" == "skipped" ]]
          fi

