      description: "Codex Connector P3 advisory."
  autoMerge: true
  deleteBranchOnMerge: true
  allowMergeCommit: false
  allowSquashMerge: true
  allowRebaseMerge: false
  requiredApprovals: 1
  requiredStatusChecks:
    - CI Gate
  repoFeatures:
    hasIssues: true
    hasProjects: true
    hasWiki: false
    hasDiscussions: true
environments:
  stage:
    reviewers:
      - jmcte
      - athena-omt
    requireApproval: true
    preventSelfReview: true
    branches: []
  prod:
    reviewers:
      - jmcte
      - athena-omt
    requireApproval: true
    preventSelfReview: true
    branches:
      - main
ci:
  codeqlSetup: default
  dependabot:
    enabled: true
    securityUpdates: true
    versionUpdates: true
    ecosystems:
      - packageEcosystem: github-actions
        directory: /
        interval: weekly
        groupMinorAndPatch: false
        ignoreMajorUpdates: true
  codeqlLanguages:
    - actions
    - python
  runnerPolicy: github-hosted-first
agents:
  sharedSkills:
    - github
    - gh-issues
policy:
  flow:
    ref: refs/tags/v1.0.1
    sha256: 52877f4225a192c6ac2250a7f289f479be83a923ce15152c517db77ab0d5249d
    bundlePath: policies/public-repository-standard-v1.json
